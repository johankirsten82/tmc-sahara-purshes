function lineRow(l={}){const d=document.createElement("div");d.className="ln";
d.innerHTML=`<input class="lName" list="catList" autocomplete="off"><div class="row"><input class="lSize" placeholder="${esc(t("size"))}"><input class="lQty" type="number" step="any" min="0" inputmode="decimal" placeholder="${esc(t("qty"))}"><input class="lUnit" list="unitList" placeholder="${esc(t("unit"))}"></div><div class="row"><input class="lPrice" type="number" step="any" min="0" inputmode="decimal" placeholder="${esc(t("price"))}"><b class="lTot" style="align-self:center;text-align:end"></b><button type="button" class="x">✕</button></div>`;
const q=s=>d.querySelector(s);q(".lName").placeholder=t("item");q(".lName").value=l.name||"";q(".lSize").value=l.size||"";q(".lQty").value=l.qty??"";q(".lUnit").value=l.unit||"pcs";q(".lPrice").value=l.price??"";
q(".lName").onchange=()=>{const c=findCat(q(".lName").value);if(c){q(".lName").value=c.name;q(".lUnit").value=c.unit;if(c.price)q(".lPrice").value=c.price;if(c.size)q(".lSize").value=c.size}oCalc()};
d.oninput=oCalc;q(".x").onclick=()=>{d.remove();oCalc()};$("oLines").appendChild(d)}
function oLinesGet(){return[...$("oLines").children].map(d=>{const q=s=>d.querySelector(s).value.trim();return{name:q(".lName"),size:q(".lSize"),qty:+q(".lQty")||0,unit:q(".lUnit")||"pcs",price:+q(".lPrice")||0}}).filter(l=>l.name)}
function oCalc(){[...$("oLines").children].forEach(d=>{d.querySelector(".lTot").textContent=fmt((+d.querySelector(".lQty").value||0)*(+d.querySelector(".lPrice").value||0))});$("oTotal").textContent=fmt(oTot({lines:oLinesGet()}))}
function oOpen(o){oEdit=o||null;oPrev=o?o.status:null;$("of").reset();$("oLines").innerHTML="";
$("oNo").value=o?o.no:nextNo();$("oSup").value=o?o.sup||"":"";$("oPlaced").value=o?o.placed:today();$("oExp").value=o?o.expected||"":"";$("oStatus").value=o?o.status:"pending";$("oNotes").value=o?o.notes||"":"";
(o?o.lines:[{}]).forEach(lineRow);$("oDel").style.display=o?"":"none";oCalc();oShow(1);scrollTo(0,0)}
$("oNew").onclick=()=>oOpen();$("oAddLine").onclick=()=>{lineRow();oCalc()};$("oCancel").onclick=()=>oShow(0);
$("oDel").onclick=()=>{if(confirm(t("delOrder"))){orders=orders.filter(x=>x!==oEdit);saveO();renderO();oShow(0)}};
$("oFilter").onchange=renderO;
$("of").onsubmit=ev=>{ev.preventDefault();const lines=oLinesGet();if(!lines.length){alert(t("needLine"));return}
const o={id:oEdit?oEdit.id:Date.now(),no:$("oNo").value.trim(),sup:$("oSup").value.trim(),placed:$("oPlaced").value,expected:$("oExp").value,status:$("oStatus").value,notes:$("oNotes").value.trim(),lines};
if(oEdit)Object.assign(oEdit,o);else orders.push(o);saveO();
if(o.status==="received"&&oPrev!=="received"&&confirm(t("logAsk"))){let k=0;
lines.forEach(l=>{data.push({id:Date.now()+(k++),name:l.name,size:l.size,qty:l.qty,unit:l.unit,price:l.price,date:today(),at:nowLocal(),order:o.no})});save();render();alert(t("logged").replace("%n",k))}
renderO();oShow(0)};
function renderO(){const f=$("oFilter").value||"all";
$("supList").innerHTML=[...new Set(orders.map(o=>o.sup).filter(Boolean))].sort().map(n=>`<option value="${esc(n)}">`).join("");
const s=orders.filter(o=>f==="all"||(f==="overdue"?isOD(o):o.status===f)).sort((a,b)=>b.placed.localeCompare(a.placed)||b.id-a.id);
$("oItems").innerHTML=s.length?s.map(o=>`<div class="item ${isOD(o)?"od":""}" data-id="${o.id}"><div><b>${esc(o.no)}</b><span class="badge b-${o.status}">${t("st_"+o.status)}</span>${isOD(o)?`<span class="badge b-overdue">${t("overdue")}</span>`:""}<br><small>${o.sup?"🏪 "+esc(o.sup)+" · ":""}📅 ${fdate(o.placed)}${o.expected?" → 🚚 "+fdate(o.expected):""}</small><br><small>📦 ${o.lines.length} · ${esc(t("lines"))}</small></div><b style="white-space:nowrap">${fmt(oTot(o))}</b></div>`).join("")+`<div class="tot" style="margin-top:8px"><span>${t("total")}</span><b>${fmt(s.reduce((a,o)=>a+oTot(o),0))}</b></div>`:`<p>${t("noOrders")}</p>`}
$("oItems").onclick=ev=>{const d=ev.target.closest("[data-id]");if(d)oOpen(orders.find(o=>o.id==d.dataset.id))};
function renderExtra(){$("catList").innerHTML=cat.map(c=>`<option value="${esc(c.name)}">`).join("");$("unitList").innerHTML=UNITS.map(u=>`<option value="${u}">`).join("");
const fv=$("oFilter").value||"all";$("oFilter").innerHTML=["all",...ST,"overdue"].map(s=>`<option value="${s}">${t(s==="all"?"fAll":s==="overdue"?"overdue":"st_"+s)}</option>`).join("");$("oFilter").value=fv;
const sv=$("oStatus").value||"pending";$("oStatus").innerHTML=ST.map(s=>`<option value="${s}">${t("st_"+s)}</option>`).join("");$("oStatus").value=sv;
renderO();if($("oForm").style.display!=="none")[...$("oLines").children].forEach(d=>{const q=s=>d.querySelector(s);q(".lName").placeholder=t("item");q(".lSize").placeholder=t("size");q(".lQty").placeholder=t("qty");q(".lUnit").placeholder=t("unit");q(".lPrice").placeholder=t("price")}),oCalc()}
$("oCsv").onclick=()=>{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;const rows=[["Order number","Supplier","Status","Date placed","Expected delivery","Item","Size","Qty","Unit","Unit price","Line total","Order total","Currency","Notes"]];
orders.forEach(o=>o.lines.forEach(l=>rows.push([o.no,o.sup,o.status,o.placed,o.expected,l.name,l.size,l.qty,l.unit,l.price,l.qty*l.price,oTot(o),cur,o.notes])));
const b=new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="orders-"+today()+".csv";a.click()};
applyLang();reset();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
